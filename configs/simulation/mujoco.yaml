xml_path: "assets/robots/magicbot_z1/scene.xml"
simulation_dt: 0.002
control_decimation: 10
render_fps: 15
perf_log_interval_s: 2.0
initial_pose_yaml: "configs/simulation/magicbot_z1_stand.yaml"
initial_command: "PASSIVE"
abnormal_torque_log_interval_steps: 100

ghost:
  enable: true
  mode: "mesh"
  update_fps: 8
  alpha: 0.22
  rgba: [0.0, 0.85, 0.38, 0.22]
  line_width: 3.0
  draw_markers: false
  marker_radius: 0.025
  link_width: 0.012
  body_names:
    - pelvis
    - torso_link
    - head_link
    - left_hip_pitch_link
    - left_hip_yaw_link
    - left_knee_link
    - left_ankle_roll_link
    - left_toe_link
    - right_hip_pitch_link
    - right_hip_yaw_link
    - right_knee_link
    - right_ankle_roll_link
    - right_toe_link
    - left_shoulder_pitch_link
    - left_shoulder_yaw_link
    - left_elbow_link
    - left_wrist_yaw_link
    - left_hand_palm_link
    - right_shoulder_pitch_link
    - right_shoulder_yaw_link
    - right_elbow_link
    - right_wrist_yaw_link
    - right_hand_palm_link

ground_penetration_correction:
  enable: true
  floor_geom: "floor"
  body_keywords: ["ankle_roll_link"]
  max_penetration: 0.002

head_camera_stream:
  enable: false
  camera_name: "head_rgba_camera"
  host: "0.0.0.0"
  port: 18080
  width: 640
  height: 480
  fps: 20
  jpeg_quality: 80

head_camera_ros2:
  enable: false
  camera_name: "head_rgba_camera"
  width: 640
  height: 480
  fps: 20
  topic_rgb: "/z1/head_camera/rgb"
  topic_rgba: "/z1/head_camera/rgba"
  frame_id: "head_rgba_camera"
  node_name: "z1_head_camera_publisher"
  qos_depth: 5
