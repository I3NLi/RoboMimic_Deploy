xml_path: "g1_description/scene_withcamera.xml"

# Number of randomly generated cubes in the scene.
# Set to 0 to use the static xml_path as-is (no generation).
num_cubes: 200
# scene_seed: 42   # uncomment for a reproducible layout
simulation_dt: 0.003
control_decimation: 7

joystick:
  # forward/lateral/yaw command axis mapping
  axis_forward: 1
  axis_lateral: 0
  axis_yaw: 2
  sign_forward: -1.0
  sign_lateral: -1.0
  sign_yaw: -1.0

head_camera_stream:
  enable: true
  camera_name: "head_rgba_camera"
  host: "0.0.0.0"
  port: 18080
  width: 640
  height: 480
  fps: 20
  jpeg_quality: 80

head_camera_view:
  enable: false
  camera_name: "head_rgba_camera"
  print_definition: true
  lock_view: false

offscreen_renderer:
  enable: true
  camera_name: "head_rgba_camera"
  width: 640
  height: 480
  fps: 20
  preview_window: true
  preview_title: "Head Camera Preview"

camera_debug:
  enable: false
  camera_name: "head_rgba_camera"
  show_frustum: true
  show_frame: true

random_blocks:
  enable: true
  body_prefix: "cube_rand_"
  x_min: 0.45
  x_max: 1.55
  y_min: -0.85
  y_max: 0.85
  z_offset: 0.003
  seed: -1
