enable: true
dry_run: false
log_events: false
command_hold_frames: 2

# action limits
max_action_abs: 3.5
max_action_delta: 0.3

# gain limits
max_kp: 300.0
max_kd: 20.0
max_kp_delta: 80.0
max_kd_delta: 8.0

# damping fallback
damping_kd: 8.0

# fault handling
fault_hold_steps: 10
fault_latch_seconds: 0.5
max_faults_before_latch: 3
